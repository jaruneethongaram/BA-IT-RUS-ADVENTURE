<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BA&IT • RUS ADVENTURE</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Tahoma,'Noto Sans Thai',sans-serif;background:#80c9ff;color:white}canvas{display:block}#hud{position:absolute;top:15px;left:15px;z-index:3;background:#07366dcc;border:2px solid #8be9ff;border-radius:18px;padding:14px;width:min(330px,calc(100vw - 30px));box-shadow:0 8px 25px #0036}#hud h2{margin:0 0 7px;color:#ffdb48;font-size:22px}#hud p{margin:5px 0;font-size:13px}#mission{font-weight:bold;color:#fff}#tip{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#082d65df;border:2px solid #e8f9ff;border-radius:18px;padding:12px 22px;text-align:center;z-index:3;min-width:250px}#interact{background:#ffcf22;color:#12356e;border:0;border-radius:12px;font-weight:bold;padding:9px 18px;margin-top:7px;cursor:pointer;display:none}#modal{position:absolute;inset:0;background:#021b4dbb;z-index:9;display:flex;align-items:center;justify-content:center;padding:15px}#panel{width:min(610px,100%);max-height:90vh;overflow:auto;background:linear-gradient(155deg,#176ac8,#0b316f);border:3px solid #9befff;border-radius:24px;padding:26px;text-align:center;box-shadow:0 12px 70px #0009}h1{font-size:clamp(30px,6vw,52px);color:#ffdd30;text-shadow:3px 4px #104ca2;margin:5px}#panel p{line-height:1.8}button{cursor:pointer} .btn{border:0;border-radius:12px;padding:13px 18px;margin:5px;background:#ffcf2c;color:#133263;font-weight:900;font-size:16px}.btn:hover{filter:brightness(1.1)}.choice{display:block;width:100%;background:#e7f5ff;color:#173a70;text-align:left;margin:9px 0;border:2px solid transparent;border-radius:12px;padding:13px;font-weight:bold}.choice:hover{border-color:#ffc72d}.small{font-size:13px;opacity:.85}#touch{position:absolute;bottom:17px;left:16px;z-index:4;display:none;grid-template-columns:repeat(3,49px);gap:5px;user-select:none;touch-action:none}#touch button{width:49px;height:49px;border-radius:12px;background:#104a91c9;border:2px solid #c4efff;color:white;font-size:23px}#turn{position:absolute;bottom:23px;right:18px;z-index:4;display:none;gap:7px}#turn button{border:2px solid #b8efff;background:#104a91c9;color:white;padding:14px;border-radius:14px;font-size:19px}#notice{position:absolute;top:14px;right:15px;background:#083c7bda;border-radius:12px;padding:9px 13px;font-size:12px;z-index:3}#sound{position:absolute;top:52px;right:15px;z-index:4;border:0;background:#ffdb45;color:#123c76;border-radius:10px;padding:9px;font-weight:bold}@media(pointer:coarse){#touch{display:grid}#turn{display:flex}#tip{bottom:185px}#hud{width:245px;padding:9px}#hud h2{font-size:17px}#notice{display:none}}</style></head><body><div id="hud"><h2>🎮 BA&IT • RUS ADVENTURE</h2><p id="place">📍 ศูนย์หันตรา</p><p id="mission">🔑 สำรวจศูนย์พื้นที่ 0/4</p><p id="score">⭐ คะแนน 0 | 🎓 สาขา 0/6</p><p class="small">WASD / ลูกศร: เดิน • Q/E: หมุนกล้อง • Space: กระโดด • F: โต้ตอบ</p></div><div id="notice">3D Campus Explorer • Prototype</div><button id="sound">🔊 เสียง</button><div id="tip"><span id="hint">เดินเข้าใกล้จุดเรืองแสงเพื่อสำรวจ</span><br><button id="interact">กด F เพื่อโต้ตอบ</button></div><div id="touch"><span></span><button data-k="ArrowUp">▲</button><span></span><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div><div id="turn"><button data-k="KeyQ">↶</button><button data-k="Space">⤒</button><button data-k="KeyE">↷</button><button id="mobileF">สำรวจ</button></div><div id="modal"><div id="panel"></div></div><script type="module">

const campus=[{name:'หันตรา',x:0,z:-45,color:blue},{name:'วาสุกรี',x:-65,z:0,color:mat('#ec4899')},{name:'นนทบุรี',x:65,z:0,color:mat('#13a7bc')},{name:'สุพรรณบุรี',x:0,z:65,color:mat('#ee9236')}];campus.forEach((c,i)=>{building(c.x,c.z,'ศูนย์'+c.name,c.color,i===0?1.05:.86)});
function bot(x,z){let g=new THREE.Group();g.position.set(x,0,z);scene.add(g);box(1.9,2,1.3,white,0,2,0,g);box(2.4,1.6,1.6,white,0,3.8,0,g);box(1.9,1,.09,dark,0,3.8,.84,g);for(let xx of [-.45,.45])box(.25,.36,.1,mat('#2befff'),xx,3.95,.91,g);box(.9,.12,.1,mat('#2befff'),0,3.5,.92,g);box(.45,1.7,.6,white,-1.35,2,0,g);box(.45,1.7,.6,white,1.35,2,0,g);for(let xx of [-.6,.6])box(.55,.9,.7,blue,xx,.55,0,g);return g}bot(4,13);
function avatar(){let g=new THREE.Group();scene.add(g);const skin=mat('#f5bb89'),hair=mat('#63341d');box(1.6,2,1,white,0,2.65,0,g);box(1.65,.3,1.05,blue,0,1.55,0,g);box(1.7,1.55,1.4,skin,0,4.5,0,g);box(1.8,.45,1.5,hair,0,5.38,0,g);for(let xx of [-.48,.48])box(.18,.22,.1,dark,xx,4.6,.75,g);for(let xx of [-.55,.55]){box(.52,1.8,.65,skin,xx*2.05,2.7,0,g);box(.58,1.5,.75,dark,xx,.75,0,g)}box(1.15,1.7,.35,dark,0,2.6,-.7,g);return g}const player=avatar();player.position.set(0,0,17);let yaw=0,vy=0,ground=true;const keys={};let score=0,done=new Set(),completed=new Set(),near=null,active=true,muted=false,ac;
function beep(freq=660){if(muted)return;try{ac??=new (window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),gain=ac.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.35,ac.currentTime+.12);gain.gain.setValueAtTime(.065,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2);o.connect(gain);gain.connect(ac.destination);o.start();o.stop(ac.currentTime+.21)}catch{}}
const zones=[];function marker(x,z,color,title,kind,id){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);let ring=new THREE.Mesh(new THREE.TorusGeometry(2.3,.2,8,32),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:1.3}));ring.rotation.x=-Math.PI/2;ring.position.y=.22;g.add(ring);let column=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.3,.12,20),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.5,transparent:true,opacity:.65}));column.position.y=.2;g.add(column);let l=label(title,5,1,'#06396e');l.position.y=3.5;g.add(l);zones.push({x,z,kind,id,title,g,ring})}

const panel=document.getElementById('panel'),modal=document.getElementById('modal');function show(html){active=false;panel.innerHTML=html;modal.style.display='flex'}function hide(){modal.style.display='none';active=true;resetKeys();renderer.domElement.focus({preventScroll:true})}function update(){document.getElementById('mission').textContent=`🔑 สำรวจศูนย์พื้นที่ ${done.size}/4`;document.getElementById('score').textContent=`⭐ คะแนน ${score} | 🎓 สาขา ${completed.size}/6`;document.getElementById('place').textContent='📍 RUS Campus World'}
function action(){if(!near||!active)return;let z=near;if(z.kind==='campus'){if(done.has(z.id)){show(`<h1>📍 ศูนย์${campus[z.id].name}</h1><p>สำรวจศูนย์พื้นที่นี้แล้ว! เดินทางไปยังจุดอื่นเพื่อสะสมกุญแจ</p><button class="btn" id="close">กลับเข้าเกม</button>`);document.getElementById('close').onclick=hide;return}done.add(z.id);score+=100;beep(880);update();show(`<h1>🔑 ได้รับกุญแจ!</h1><h2>ศูนย์${campus[z.id].name}</h2><p>สำรวจพื้นที่มหาวิทยาลัยสำเร็จ ได้รับ 100 คะแนน<br>เก็บกุญแจครบ ${done.size}/4</p><button class="btn" id="close">ผจญภัยต่อ</button>`);document.getElementById('close').onclick=hide}else{if(done.size<4){show(`<h2>🔒 Career World ยังล็อกอยู่</h2><p>ต้องสำรวจให้ครบ 4 ศูนย์พื้นที่ก่อนปลดล็อกภารกิจสาขาวิชา (${done.size}/4)</p><button class="btn" id="close">กลับไปสำรวจ</button>`);document.getElementById('close').onclick=hide;return}if(completed.has(z.id)){show(`<h2>🏆 ${programs[z.id]}</h2><p>คุณผ่านภารกิจนี้แล้ว</p><button class="btn" id="close">กลับเข้าเกม</button>`);document.getElementById('close').onclick=hide;return}let q=questions[z.id];show(`<h2>🎓 ${programs[z.id]}</h2><p>${q[0]}</p>${q[1].map((a,i)=>`<button class="choice" data-answer="${i}">${i+1}. ${a}</button>`).join('')}`);panel.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(+b.dataset.answer===q[2]){completed.add(z.id);score+=300;beep(1000);update();show(`<h1>🎉 Mission Complete!</h1><p>ปลดล็อกสาขา <b>${programs[z.id]}</b> สำเร็จ<br>+300 คะแนน</p><button class="btn" id="close">เล่นต่อ</button>`);document.getElementById('close').onclick=()=>{hide();if(completed.size===6)finish()}}else{beep(230);b.textContent='ลองอีกครั้ง! '+b.textContent}})}}
function finish(){show(`<h1>🏆 BA&IT • RUS ADVENTURE</h1><h2>YOU WIN!</h2><p>สำรวจครบ 4 ศูนย์พื้นที่ และปลดล็อก 6 สาขาวิชาแล้ว!<br>คะแนนรวม <b>${score}</b> คะแนน</p><p>คณะบริหารธุรกิจและเทคโนโลยีสารสนเทศ<br>มหาวิทยาลัยเทคโนโลยีราชมงคลสุวรรณภูมิ</p><a class="btn" style="display:inline-block;text-decoration:none" href="https://admis.rmutsb.ac.th/" target="_blank" rel="noopener">สมัครเรียนออนไลน์ ↗</a><a class="btn" style="display:inline-block;text-decoration:none" href="https://bait.rmutsb.ac.th/" target="_blank" rel="noopener noreferrer">คณะบริหาร ↗</a><button class="btn" id="close">เดินสำรวจต่อ</button>`);document.getElementById('close').onclick=hide}
show(`<h1>BA&IT • RUS ADVENTURE</h1><h2>🌟 4 ศูนย์พื้นที่ • 6 สาขาวิชา</h2><p>ยินดีต้อนรับสู่โลกมหาวิทยาลัย 3 มิติ! เดินสำรวจอาคารสไตล์ Roblox เก็บกุญแจจากทั้ง 4 ศูนย์พื้นที่ แล้วตอบคำถามเพื่อปลดล็อก 6 เส้นทางอนาคต</p><p class="small">WASD / ลูกศร = เดิน | Q/E = หมุนกล้อง | Space = กระโดด | F = สำรวจ<br>มือถือ: ใช้ปุ่มบนหน้าจอ</p><button class="btn" id="start">▶ เริ่มผจญภัย</button><p class="small">ต้องเชื่อมต่ออินเทอร์เน็ตเพื่อโหลด Three.js ในครั้งที่เปิดเกม</p>`);document.getElementById('start').onclick=()=>{hide();beep()};
// Reliable keyboard input: physical key codes, Thai/English layouts, and lost-focus recovery.
const controlCodes=new Set(['KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','KeyF','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
const fallbackKeys={w:'KeyW',a:'KeyA',s:'KeyS',d:'KeyD',q:'KeyQ',e:'KeyE',f:'KeyF',' ':'Space',
'ArrowUp':'ArrowUp','ArrowDown':'ArrowDown','ArrowLeft':'ArrowLeft','ArrowRight':'ArrowRight'};
function getControl(e){if(controlCodes.has(e.code))return e.code;return fallbackKeys[e.key?.toLowerCase()]||fallbackKeys[e.key]||null}
function resetKeys(){for(const k of Object.keys(keys))keys[k]=false}
window.addEventListener('keydown',e=>{
 const k=getControl(e);if(!k)return;
 if(e.target?.matches?.('input,textarea,select,[contenteditable="true"]'))return;
 e.preventDefault();keys[k]=true;
 if(k==='KeyF'&&!e.repeat)action();
},true);

document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)});document.getElementById('mobileF').onclick=action;document.getElementById('interact').onclick=action;document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'🔇 ปิดเสียง':'🔊 เสียง'};
let last=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-last)/1000,.05);last=now;if(active){let forward=Number(keys.KeyW||keys.ArrowUp)-Number(keys.KeyS||keys.ArrowDown),side=Number(keys.KeyD||keys.ArrowRight)-Number(keys.KeyA||keys.ArrowLeft);if(keys.KeyQ)yaw+=dt*1.7;if(keys.KeyE)yaw-=dt*1.7;let len=Math.hypot(forward,side);if(len){forward/=len;side/=len;let vx=Math.sin(yaw)*forward+Math.cos(yaw)*side,vz=-Math.cos(yaw)*forward+Math.sin(yaw)*side;let nx=player.position.x+vx*dt*12,nz=player.position.z+vz*dt*12;let blocked=campus.some(c=>Math.abs(nx-c.x)<(c.name==='หันตรา'?14:12)&&Math.abs(nz-c.z)<8.2);if(!blocked){player.position.x=THREE.MathUtils.clamp(nx,-117,117);player.position.z=THREE.MathUtils.clamp(nz,-117,117)}player.rotation.y=Math.atan2(vx,vz)}if(keys.Space&&ground){vy=9;ground=false;beep(430)}vy-=24*dt;player.position.y=Math.max(0,player.position.y+vy*dt);if(player.position.y===0){vy=0;ground=true}}let offset=new THREE.Vector3(-Math.sin(yaw)*12,9,Math.cos(yaw)*12),target=player.position.clone().add(offset);camera.position.lerp(target,Math.min(1,dt*5));camera.lookAt(player.position.x,player.position.y+3,player.position.z);near=null;let best=5;for(let z of zones){z.ring.rotation.z+=dt*.5;z.g.children[1].rotation.y+=dt*.4;let d=Math.hypot(player.position.x-z.x,player.position.z-z.z);if(d<best){near=z;best=d}}document.getElementById('hint').textContent=near?`✨ ${near.title} — กด F เพื่อสำรวจ`:'เดินเข้าใกล้วงแหวนเรืองแสงเพื่อทำภารกิจ';document.getElementById('interact').style.display=near?'inline-block':'none';renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
